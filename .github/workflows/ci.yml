name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/taskbar-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --locked -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo build --manifest-path backend/Cargo.toml --locked --release
      - run: shellcheck scripts/*.sh tests/smoke/*.sh tests/acceptance/*.sh
      - run: tests/smoke/static.sh
      - run: python3 tests/smoke/lifecycle.test.py
      - run: TASKBAR_TEST_BINARY="$CARGO_TARGET_DIR/release/workspace-taskbar-backend" python3 tests/backend/test_transactions.py
      - run: git diff --exit-code
